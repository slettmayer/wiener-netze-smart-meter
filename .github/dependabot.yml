version: 2
# The two ecosystems run on different days. Their PRs auto-merge, and the
# ruleset requires a branch to be up to date with main -- which auto-merge
# never does for you -- so a same-day pair would strand the second PR.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      github-actions:
        patterns:
          - "*"
  # Watches requirements_lint.txt and requirements_test.txt. Without this the
  # pins are never bumped, and pinning without a bumper is how tooling silently
  # goes stale. Kept as one group so a ruff bump and a test-harness bump that
  # land the same week arrive as one PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-lint-deps:
        patterns:
          - "*"

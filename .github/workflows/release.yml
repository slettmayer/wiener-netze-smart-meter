name: Auto Release

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

jobs:
  release:
    # Only for a successful push to this repository. `branches` matches the
    # head branch name, so a fork PR from a branch called `main` would pass it.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Extract version from manifest.json
        id: version
        run: |
          version=$(jq -r '.version' custom_components/wiener_netze_smart_meter/manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          notes=$(awk -v ver="${VERSION}" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/^$/N;/^\n$/d' -e 's/^[[:space:]]*//')
          echo "${notes}" > /tmp/release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build the HACS archive
        if: steps.check.outputs.exists == 'false'
        id: archive
        run: scripts/build_release_zip.sh

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --notes-file /tmp/release-notes.md \
            "${ARCHIVE}"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # HACS offers only the five latest releases for download, so leftover
      # test builds would push stable versions out of that list.
      - name: Delete this version's test builds
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            if [[ "${tag}" =~ ^"${TAG}"b[0-9]+$ ]]; then
              gh release delete "${tag}" --cleanup-tag --yes
            fi
          done
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
